[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lumi-fit"
version = "0.1.0"
description = "Plan LLM serving models and resource allocations for LUMI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lumi-fit contributors" }]
dependencies = [
  "pydantic>=2.6,<3",
  "prompt-toolkit>=3.0.48,<4",
  "PyYAML>=6,<7",
]

[project.scripts]
lumi-fit = "lumi_fit.cli:main"

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/lumi-fit/data/billing" = ["data/billing/*.yaml"]
"share/lumi-fit/data/models" = ["data/models/*.yaml"]
"share/lumi-fit/data/partitions" = ["data/partitions/*.yaml"]
"share/lumi-fit/data/runtimes" = ["data/runtimes/*.yaml"]
"share/lumi-fit/data/scoring" = ["data/scoring/*.yaml"]
"share/lumi-fit/data/systems" = ["data/systems/*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
