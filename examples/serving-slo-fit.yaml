schema_version: "1.0"
mode: online
use_case: coding
input_tokens: 8192
max_output_tokens: 2048
max_model_length: 16384
concurrent_sequences: 8
request_arrival_rate_per_second: 0.25
service_duration: 8 hours

# A production profile can contain several weighted prompt/output length points.
token_length_distribution:
  - input_tokens: 8192
    output_tokens: 2048
    probability: 1
minimum_context_coverage: 1

latency_targets:
  max_ttft_seconds: 3
  max_itl_seconds: 0.08
throughput_targets:
  min_requests_per_second: 0.25
required_slo_attainment: 0.99
maximum_failure_rate: 0.01
minimum_quality_score: 70

minimum_hbm_headroom_fraction: 0.15
allowed_runtimes:
  - vllm
allowed_quantizations:
  - bf16
  - fp16
